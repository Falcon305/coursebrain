[project]
name = "coursebrain"
version = "0.1.0"
description = "Turn long-form video into a composable knowledge base your coding agent can read, cite, and write from"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hatim Razani" }]
keywords = ["youtube", "transcripts", "rag", "knowledge-base", "claude", "agents", "notes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]

# Core stays thin: fetch -> normalize -> segment -> distill must keep working
# even if the optional stacks break on upgrade.
dependencies = [
    "yt-dlp>=2026.6.0",
    "pyyaml>=6.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
]

[project.urls]
Homepage = "https://github.com/Falcon305/coursebrain"
Repository = "https://github.com/Falcon305/coursebrain"
Issues = "https://github.com/Falcon305/coursebrain/issues"
Changelog = "https://github.com/Falcon305/coursebrain/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Semantic half of hybrid search. Vectors live in the same SQLite file as the
# keyword index, and model2vec is static-embedding (no torch) — ~100MB, not ~2GB.
rag = [
    "sqlite-vec>=0.1.9",
    "model2vec>=0.4.0",
]
# Unattended distillation through the Anthropic API. Not needed inside an agent.
api = [
    "anthropic>=0.40.0",
]
# Tracing, prompt versioning, cost attribution. No-ops when unconfigured.
obs = [
    "langfuse>=2.50.0",
]
all = ["coursebrain[rag,api,obs]"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9.0",
    "mypy>=1.14",
    "types-PyYAML>=6.0",
]
# mkdocs is pinned below 2.0 deliberately: 2.0 removes the plugin system and the
# theming system with no migration path, so an unpinned build would break silently.
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<10.0",
]

[project.scripts]
coursebrain = "coursebrain.cli:main"
brain = "coursebrain.cli:main"

# Third parties add ingest sources and note schemas by registering here.
[project.entry-points."coursebrain.sources"]
youtube = "coursebrain.sources.youtube:YouTubeSource"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coursebrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/coursebrain"]
omit = ["*/prompts/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "PTH",       # use pathlib
    "TID",       # tidy imports
]
ignore = [
    "E501",      # line length is the formatter's job
    "B008",      # typer uses function calls in argument defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
files = ["src/coursebrain"]
strict = true
warn_unreachable = true
# these three are optional extras; their absence must not fail type checking
[[tool.mypy.overrides]]
module = ["sqlite_vec.*", "model2vec.*", "anthropic.*", "langfuse.*", "yaml.*"]
ignore_missing_imports = true
