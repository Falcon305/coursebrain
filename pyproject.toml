[project]
name = "course-kb"
version = "0.1.0"
description = "Turn long YouTube programming series into a durable, searchable knowledge base for coding agents"
requires-python = ">=3.12"

# Core stays deliberately thin: fetch -> normalize -> segment -> distill must keep
# working even if the heavier optional stacks break on upgrade.
dependencies = [
    "yt-dlp>=2026.6.0",
    "anthropic>=0.40.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Semantic half of hybrid search. Vectors live in the same SQLite file as the
# keyword index, and model2vec is static-embedding (no torch) — ~100MB, not ~2GB.
rag = [
    "sqlite-vec>=0.1.9",
    "model2vec>=0.4.0",
]
# Durable resume + per-node retry for the distill graph.
orchestration = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
]
# Tracing, prompt versioning, cost attribution. No-ops when unconfigured.
obs = [
    "langfuse>=2.50.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
course = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
