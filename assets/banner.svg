<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="coursebrain — learn from long-form video, then write from what you learned">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111a21"/>
      <stop offset="100%" stop-color="#0a1418"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <circle cx="1050" cy="120" r="150" fill="#2dd4bf" opacity="0.10" filter="url(#soft)"/>
  <circle cx="1180" cy="300" r="110" fill="#38bdf8" opacity="0.08" filter="url(#soft)"/>

  <!-- wordmark -->
  <text x="80" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="62" font-weight="700" fill="#e6edf3" letter-spacing="-1.5">
    coursebrain
  </text>
  <rect x="82" y="170" width="168" height="4" rx="2" fill="url(#fade)"/>

  <text x="80" y="222" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, sans-serif"
        font-size="25" fill="#9fb2c4">
    Learn from long-form video, then write from what you learned.
  </text>

  <text x="80" y="266" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, sans-serif"
        font-size="17" fill="#6e8496">
    Cited notes with timestamps · hybrid search · courses that compose into skills
  </text>

  <!-- pipeline -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
    <g transform="translate(80,312)">
      <rect width="132" height="44" rx="9" fill="#161f27" stroke="#243440"/>
      <text x="66" y="28" fill="#8fa6b8" text-anchor="middle">video</text>
    </g>
    <path d="M224 334 h34" stroke="#2f4351" stroke-width="2"/>
    <path d="M252 328 l8 6 -8 6z" fill="#2f4351"/>

    <g transform="translate(270,312)">
      <rect width="156" height="44" rx="9" fill="#161f27" stroke="#243440"/>
      <text x="78" y="28" fill="#8fa6b8" text-anchor="middle">transcripts</text>
    </g>
    <path d="M438 334 h34" stroke="#2f4351" stroke-width="2"/>
    <path d="M466 328 l8 6 -8 6z" fill="#2f4351"/>

    <g transform="translate(484,312)">
      <rect width="150" height="44" rx="9" fill="#12211f" stroke="#2a4a45"/>
      <text x="75" y="28" fill="#7fd8cc" text-anchor="middle">notes</text>
    </g>
    <path d="M646 334 h34" stroke="#2f4351" stroke-width="2"/>
    <path d="M674 328 l8 6 -8 6z" fill="#2f4351"/>

    <g transform="translate(692,312)">
      <rect width="196" height="44" rx="9" fill="#12211f" stroke="#2a4a45"/>
      <text x="98" y="28" fill="#7fd8cc" text-anchor="middle">capability pack</text>
    </g>
    <path d="M900 334 h34" stroke="#2f4351" stroke-width="2"/>
    <path d="M928 328 l8 6 -8 6z" fill="#2f4351"/>

    <g transform="translate(946,312)">
      <rect width="132" height="44" rx="9" fill="#0f2430" stroke="url(#accent)" stroke-width="1.5"/>
      <text x="66" y="28" fill="#2dd4bf" text-anchor="middle">skill</text>
    </g>
  </g>

  <text x="1100" y="341" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif"
        font-size="14" fill="#5c7183">composes</text>
</svg>
