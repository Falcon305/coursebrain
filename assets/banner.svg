<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="coursebrain — point your agent at playlists on a subject and it studies them">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1016"/>
      <stop offset="55%" stop-color="#101a22"/>
      <stop offset="100%" stop-color="#0a1417"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <circle cx="1075" cy="105" r="155" fill="#2dd4bf" opacity="0.11" filter="url(#glow)"/>
  <circle cx="1195" cy="315" r="115" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>

  <text x="80" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="58" font-weight="700" fill="#e6edf3" letter-spacing="-1.5">coursebrain</text>
  <rect x="82" y="148" width="176" height="4" rx="2" fill="url(#rule)"/>

  <text x="80" y="204" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, sans-serif"
        font-size="27" fill="#dbe7f0">Your agent doesn't search your playlists.</text>
  <text x="80" y="242" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, sans-serif"
        font-size="27" font-weight="600" fill="#2dd4bf">It studied them.</text>

  <text x="80" y="286" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, sans-serif"
        font-size="16" fill="#6e8496">
    Cited notes with timestamps · compiled into Claude Code skills · nothing retrieved at answer time
  </text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14.5">
    <g transform="translate(80,330)">
      <rect width="150" height="46" rx="10" fill="#151f27" stroke="#22333f"/>
      <text x="75" y="29" fill="#8ba2b4" text-anchor="middle">playlists</text>
    </g>
    <path d="M242 353 h32" stroke="#2c4150" stroke-width="2"/><path d="M268 347 l9 6 -9 6z" fill="#2c4150"/>

    <g transform="translate(286,330)">
      <rect width="164" height="46" rx="10" fill="#151f27" stroke="#22333f"/>
      <text x="82" y="29" fill="#8ba2b4" text-anchor="middle">transcripts</text>
    </g>
    <path d="M462 353 h32" stroke="#2c4150" stroke-width="2"/><path d="M488 347 l9 6 -9 6z" fill="#2c4150"/>

    <g transform="translate(506,330)">
      <rect width="178" height="46" rx="10" fill="#122120" stroke="#2a4a45"/>
      <text x="89" y="29" fill="#7fd8cc" text-anchor="middle">cited notes</text>
    </g>
    <path d="M696 353 h32" stroke="#2c4150" stroke-width="2"/><path d="M722 347 l9 6 -9 6z" fill="#2c4150"/>

    <g transform="translate(740,330)">
      <rect width="196" height="46" rx="10" fill="#122120" stroke="#2a4a45"/>
      <text x="98" y="29" fill="#7fd8cc" text-anchor="middle">capability pack</text>
    </g>
    <path d="M948 353 h32" stroke="#2c4150" stroke-width="2"/><path d="M974 347 l9 6 -9 6z" fill="#2c4150"/>

    <g transform="translate(992,330)">
      <rect width="150" height="46" rx="10" fill="#0e2531" stroke="url(#accent)" stroke-width="1.6"/>
      <text x="75" y="29" fill="#2dd4bf" text-anchor="middle">skill</text>
    </g>
  </g>

  <text x="1160" y="359" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif"
        font-size="13.5" fill="#55697a">compounds</text>
</svg>
