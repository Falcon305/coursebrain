site_name: coursebrain
site_description: Learn from long-form video, then write from what you learned.
site_url: https://falcon305.github.io/coursebrain/
repo_url: https://github.com/Falcon305/coursebrain
repo_name: Falcon305/coursebrain
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Composition: composition.md
  - Profiles: profiles.md
  - Writing a source plugin: plugins.md
  - CLI reference: cli.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.snippets

plugins:
  - search
